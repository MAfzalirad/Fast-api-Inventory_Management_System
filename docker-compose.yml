version: '3.8'
services:
  pgdb:
    image: 'postgres:16'
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - 5423:5432
    environment:
      - POSTGRES_USER=abzil
      - POSTGRES_PASSWORD=abzil123
      - POSTGRES_DB=imsdb
  backend:
    build: ./
    volumes:
      - ./:/app
    ports:
      - 3000:3000
    depends_on:
      - pgdb
    
  alembic:
    build: ./
    volumes:
      - ./:/app
    entrypoint: ['alembic']
    depends_on:
      - pgdb

volumes:
  pg-data: